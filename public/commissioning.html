<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CasperCX preview</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive preview of a commissioning checklist and issue tracker. Sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface2:#f5f7f9; --ink:#12202c; --muted:#586876;
  --line:#d3dbe2; --line2:#e5eaef;
  --accent:#1f3f8f; --accent-ink:#ffffff; --accent-soft:#e2e9f8;
  --pass:#17803f; --pass-soft:#dff2e6;
  --fail:#c22f3a; --fail-soft:#fbe4e6;
  --warn:#96600a; --warn-soft:#fbeed6;
  --na:#5f6d79; --na-soft:#e8ecf0;
  --shadow:0 1px 2px rgba(18,32,44,.06),0 6px 18px rgba(18,32,44,.07);
  --overlay:rgba(12,20,28,.5);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d141b; --surface:#141e28; --surface2:#19252f; --ink:#e6edf3; --muted:#93a3b1;
    --line:#2a3947; --line2:#223040;
    --accent:#86a6ff; --accent-ink:#0b1424; --accent-soft:#1c2a4a;
    --pass:#4dc884; --pass-soft:#153a27;
    --fail:#ff7b84; --fail-soft:#42191e;
    --warn:#f0b455; --warn-soft:#3b2b0d;
    --na:#9aa9b6; --na-soft:#222f3a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --overlay:rgba(0,0,0,.62);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d141b; --surface:#141e28; --surface2:#19252f; --ink:#e6edf3; --muted:#93a3b1;
  --line:#2a3947; --line2:#223040;
  --accent:#86a6ff; --accent-ink:#0b1424; --accent-soft:#1c2a4a;
  --pass:#4dc884; --pass-soft:#153a27;
  --fail:#ff7b84; --fail-soft:#42191e;
  --warn:#f0b455; --warn-soft:#3b2b0d;
  --na:#9aa9b6; --na-soft:#222f3a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --overlay:rgba(0,0,0,.62);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.45;padding-inline:16px;padding-block:16px 48px}
.mono{font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.wrap{max-width:1180px;margin:0 auto}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.logo{font-weight:600;font-size:19px;letter-spacing:-.015em}
.logo b{color:var(--accent);font-weight:600}
.proj{color:var(--muted);font-size:13px}
.proj .mono{font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}

.hint{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--accent-soft);border:1px solid var(--line);padding:10px 14px;border-radius:8px;margin-top:14px;font-size:13px}
.hint button{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:0 2px}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-top:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:500;color:var(--muted);white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
.badge{display:inline-block;min-width:20px;text-align:center;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--fail);color:#fff;font-size:11px;font-weight:600;line-height:18px}

main{margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--na-soft);color:var(--na);white-space:nowrap}
.pill.pass{background:var(--pass-soft);color:var(--pass)}
.pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--fail)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.spread{justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:500;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* overview */
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:20px}
.bigrow{display:flex;flex-wrap:wrap;gap:18px 32px;margin-bottom:14px}
.bignum{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.bignum small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:6px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--na-soft)}
.bar i{display:block;height:100%}
.bar .s-notstarted{background:var(--line)}
.bar .s-inprogress{background:var(--warn)}
.bar .s-complete{background:var(--accent)}
.bar .s-verified{background:var(--pass)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c)}
.list{display:flex;flex-direction:column}
.li{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
table.plain{width:100%;border-collapse:collapse}
table.plain th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.plain td{padding:9px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
.tw{overflow-x:auto}
.num{font-variant-numeric:tabular-nums}
.act{font-size:13px}
.act .t{color:var(--muted);font-size:12px;margin-right:8px}

/* matrix */
.mtop{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.mtop h2{font-size:20px;letter-spacing:-.01em}
.mwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.matrix{border-collapse:separate;border-spacing:0;width:100%;min-width:660px}
.matrix th,.matrix td{border-bottom:1px solid var(--line2);padding:6px 10px;vertical-align:middle}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:250px;max-width:320px;border-right:1px solid var(--line)}
.matrix thead th{vertical-align:bottom;padding-block:12px;text-align:center;font-weight:500}
.matrix thead th:first-child{text-align:left}
.matrix tr.sec td{background:var(--surface2);font-weight:600;padding-block:8px}
.matrix tr.sec td:first-child{background:var(--surface2)}
.matrix td.u{text-align:center;min-width:150px}
.matrix td.flag{background:var(--warn-soft)}
.matrix tr:last-child td{border-bottom:0}
.tag{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:14px}
.tmini{display:flex;justify-content:center;gap:4px;margin-top:6px}
.dot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;font-size:9px;font-weight:600;font-family:'IBM Plex Mono',monospace;background:var(--line);color:var(--muted)}
.dot.inprogress{background:var(--warn-soft);color:var(--warn)}
.dot.complete{background:var(--accent-soft);color:var(--accent)}
.dot.verified{background:var(--pass);color:#fff}
.cellbtn{width:38px;height:30px;border-radius:6px;border:1px dashed var(--line);background:transparent;display:inline-grid;place-items:center;font-weight:600;font-size:12px;color:var(--muted)}
.cellbtn.p{background:var(--pass-soft);color:var(--pass);border:1px solid transparent}
.cellbtn.n{background:var(--na-soft);color:var(--na);border:1px solid transparent}
.cellbtn.f{background:var(--fail-soft);color:var(--fail);border:1px solid transparent}
.ref{font-size:10.5px;color:var(--fail);margin-top:2px}
.tri{display:grid;grid-template-columns:34px 1fr;gap:1px 8px;font-size:12px;text-align:left;width:100%;background:none;border:0;padding:2px 0}
.tri i{font-style:normal;color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;padding-top:1px}
.tri .diff{color:var(--warn);font-weight:600}
.flagnote{font-size:11px;color:var(--warn);font-weight:600;margin-top:3px;text-align:left}
.flagnote.ok{color:var(--pass)}
.colhead{display:flex;flex-direction:column;align-items:center;gap:4px}
.mini-progress{width:90px;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.mini-progress i{display:block;height:100%;background:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.legendm{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted);align-items:center}
.narrow-only{display:none}
@media (max-width:719px){.narrow-only{display:block}}

/* tests */
.test{max-width:780px}
.tline{display:grid;grid-template-columns:28px 1fr;gap:6px 10px;padding:12px 0;border-bottom:1px solid var(--line2)}
.tline .n{color:var(--muted);font-family:'IBM Plex Mono',monospace;font-size:12px;padding-top:2px}
.tline .ctl{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:16px 0 4px;border-bottom:1px solid var(--line)}
.var{font-family:'IBM Plex Mono',monospace;font-size:12.5px;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px;white-space:nowrap}
.pfseg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.pfseg button{border:0;background:var(--surface);padding:5px 12px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.pfseg button:last-child{border-right:0}
.pfseg button[aria-pressed=true].p{background:var(--pass);color:#fff}
.pfseg button[aria-pressed=true].f{background:var(--fail);color:#fff}
.pfseg button[aria-pressed=true].n{background:var(--na);color:#fff}
.attempts{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}

/* issues */
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.pri{font-weight:600;font-size:12px}
.pri.URGENT,.pri.HIGH{color:var(--fail)}
.pri.MODERATE{color:var(--warn)}
.pri.LOW{color:var(--muted)}
.ph{display:inline-grid;place-items:center;width:44px;height:34px;border-radius:6px;background:var(--surface2);border:1px solid var(--line);color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:calc(100dvh - 32px);overflow:auto;padding:20px}
@media (max-width:560px){.ov{align-items:flex-end;padding:0}.md{border-radius:14px 14px 0 0;max-width:none;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.md h3{font-size:17px;margin-bottom:4px}
.md .sub{color:var(--muted);margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 10px;min-height:38px}
textarea.inp{min-height:76px;resize:vertical}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0 0 14px}
.kv dt{color:var(--muted);font-size:12px;letter-spacing:.03em;padding-top:1px}
.kv dd{margin:0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.comments{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.cm{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13px}
.cm b{font-weight:600}
.cm span{color:var(--muted);font-size:11px;margin-left:6px}
.photos{display:flex;gap:6px;margin:6px 0 14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:60;font-weight:500;max-width:calc(100% - 32px)}

/* phone */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.cap{color:var(--muted);font-size:13px;text-align:center;max-width:520px}
.phone{width:100%;max-width:392px;height:780px;background:var(--surface);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:440px){.phone{border-radius:16px;height:720px}}
.ph-head{padding:14px 16px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.ph-head .t1{font-weight:600;font-size:16px}
.ph-head .t2{color:var(--muted);font-size:12px}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sig{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--pass)}
.sig.off{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.offbar{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500;padding:6px 16px}
.ph-body{flex:1;overflow:auto;background:var(--bg)}
.ph-foot{border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface)}
.ph-foot .btn{width:100%;min-height:46px;font-weight:600}
.pgroup{padding:16px 16px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line2);padding:12px 16px}
.pcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.pcard .r2{color:var(--muted);font-size:12px;margin-top:2px}
.pcard .bar{margin-top:8px;height:6px}
.pcard .bar i{background:var(--accent)}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.psec{background:var(--surface);margin-top:10px;border-block:1px solid var(--line)}
.psec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;width:100%;background:var(--surface2);border:0;text-align:left;font-weight:600}
.psec-h small{font-weight:500;color:var(--muted)}
.pl{padding:12px 16px;border-top:1px solid var(--line2)}
.pl p{margin:0 0 10px}
.p3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pfn{min-height:46px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;color:var(--muted)}
.pfn[aria-pressed=true].p{background:var(--pass);border-color:var(--pass);color:#fff}
.pfn[aria-pressed=true].f{background:var(--fail);border-color:var(--fail);color:#fff}
.pfn[aria-pressed=true].n{background:var(--na);border-color:var(--na);color:#fff}
.pfn:disabled{opacity:.55}
.ref2{font-size:12px;color:var(--muted);margin-bottom:8px}
.ref2 b{color:var(--ink);font-weight:500}
.inrow{display:flex;gap:6px}
.cam{min-width:46px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.cam.on{color:var(--pass);border-color:var(--pass)}
.warnline{font-size:12px;color:var(--warn);margin-top:6px;font-weight:500}
.banner{margin:12px 16px 0;padding:10px 12px;border-radius:9px;background:var(--accent-soft);font-size:13px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--pass-soft);color:var(--pass)}
.back{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.plink{font-size:12px;color:var(--accent);font-weight:600;background:none;border:0;padding:4px 0}

/* paper */
.rtabs{margin-bottom:6px}
.paper{background:#fff;color:#151b21;max-width:860px;margin:14px auto 0;padding:34px 40px;box-shadow:var(--shadow);border:1px solid var(--line);font-size:11.5px;overflow-x:auto}
.paper h2{font-size:17px;letter-spacing:-.01em;margin-bottom:2px}
.paper .meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 20px;color:#4d5964;border-bottom:2px solid #151b21;padding-bottom:8px;margin-bottom:10px}
.paper table{width:100%;border-collapse:collapse;min-width:520px}
.paper th,.paper td{border:1px solid #c5ccd3;padding:4px 6px;text-align:left;vertical-align:top}
.paper th{background:#eef1f4;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}
.paper td.c{text-align:center}
.paper tr.s td{background:#eef1f4;font-weight:600}
.paper .d{font-weight:700;text-decoration:underline}
.paper .foot{display:flex;justify-content:space-between;margin-top:12px;color:#4d5964;font-size:10.5px}
.paper .th2{width:38px;height:28px;background:#e5e9ed;display:inline-block;border-radius:3px;margin-right:4px;vertical-align:middle}
[hidden]{display:none!important}
body{margin:0}
.sitefoot{max-width:1180px;margin:32px auto 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">Casper<b>CX</b></div>
      <div class="proj">Riverside Elementary School · <span class="mono">CX-2026-014</span> · sample data</div>
    </div>
    <div class="seg" role="group" aria-label="Preview as">
      <button type="button" data-act="view" data-v="agent" aria-pressed="true">Agent</button>
      <button type="button" data-act="view" data-v="contractor" aria-pressed="false">Contractor (phone)</button>
    </div>
  </header>
  <div id="hint"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
  <main id="main"></main>
  <div class="sitefoot">Interactive preview with sample data. Company names and figures are fictional. A Casper Media LLC project in early development.</div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var fmtDate=function(d){var p=d.split('-');return MONTHS[+p[1]-1]+' '+(+p[2]);};
var nowT=function(){try{return new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});}catch(e){return 'now';}};

/* ---------- reference data ---------- */
var TRADES=['GC','HVAC','Electrical','Controls'];
var TL={GC:'General',HVAC:'HVAC',Electrical:'Electrical',Controls:'Controls'};

/* ---------- helpers ---------- */
function linesOf(trade){return ALL.filter(function(l){return l.sec.trade===trade;});}
function isDone(unit,l){return l.attr?!!(S.inst[unit][l.attr.k]||'').trim():!!S.res[unit][l.id];}
function prog(unit,trade){var ls=linesOf(trade);var d=ls.filter(function(l){return isDone(unit,l);}).length;return {done:d,total:ls.length};}
function vals(unit,k){var a=(ATTR[unit]||{})[k]||{};return {spec:a.spec||'',sub:a.sub||'',inst:(S.inst[unit][k]||'')};}
function differs(v){var m={};[v.spec,v.sub,v.inst].forEach(function(x){if(x&&x.trim())m[x.trim().toLowerCase()]=1;});return Object.keys(m).length>1;}
function needsReview(unit,k){return differs(vals(unit,k))&&!S.resolve[unit][k];}
function reviewCount(){var n=0;UNITS.forEach(function(u){Object.keys(ATTR[u.tag]).forEach(function(k){if(needsReview(u.tag,k))n++;});});return n;}
function openIssues(){return S.issues.filter(function(i){return i.status!=='Closed';});}
function issueById(id){return S.issues.filter(function(i){return i.id===id;})[0];}
function log(who,text){S.audit.unshift({t:nowT(),who:who,text:text});}
function toast(msg){var el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(function(){el.hidden=true;},2600);}
function touch(unit,trade){if(S.st[unit][trade]==='notstarted')S.st[unit][trade]='inprogress';}
function locked(unit,trade){var s=S.st[unit][trade];return s==='complete'||s==='verified';}
function pill(cls,text){return '<span class="pill '+cls+'">'+esc(text)+'</span>';}
function statusPill(st){return pill(STP[st],STL[st]);}
function issuePill(s){return pill(ISTP[s],s);}
function isNarrow(){return window.matchMedia('(max-width:719px)').matches;}

function newIssue(o){
 var id;
 if(o.chk){var n=(S.chkSeq[o.chk]=(S.chkSeq[o.chk]||0)+1);id='CHK-'+o.chk+'-'+n;}
 else{id='FO-3-'+(S.nextFO++);}
 var it={id:id,status:'Open',pri:o.pri,desc:o.desc,asset:o.asset,trade:o.trade,due:o.due,source:o.source,by:o.by,photos:o.photos?1:0,comments:[]};
 S.issues.unshift(it);
 return it;
}

/* ---------- agent: tests ---------- */
function attStatus(a){
 var lines=TESTLINES.filter(function(x){return x.t==='s';});
 var ans=lines.filter(function(x){return a.res[x.id];}).length;
 var fails=lines.filter(function(x){return a.res[x.id]==='f';}).length;
 if(!ans)return 'notstarted';
 if(ans<lines.length)return 'inprogress';
 return fails?'failed':'passed';
}
function attStatusText(a){return {notstarted:'Not started',inprogress:'In progress',failed:'Failed',passed:'Passed'}[attStatus(a)];}
function attStatusCls(a){return {notstarted:'',inprogress:'warn',failed:'fail',passed:'pass'}[attStatus(a)];}
function vTests(){

 if(c.kind==='line'){
  opts.chk=CHKNO[c.unit+'|'+c.trade];opts.source='Checklist '+c.unit;opts.by=S.view==='agent'?'Dana Ortiz (CxA)':'Sam Rivera';
  it=newIssue(opts);S.res[c.unit][c.line]='f';S.issueAt[c.unit+'|'+c.line]=it.id;touch(c.unit,c.trade);

  opts.chk=CHKNO[c.unit+'|HVAC'];opts.source='Checklist '+c.unit;opts.by='Dana Ortiz (CxA)';
  it=newIssue(opts);S.resolve[c.unit][c.k]=it.id;
 }else if(c.kind==='test'){
  opts.chk=null;opts.source='Test TST-11, attempt '+c.n;opts.by='Dana Ortiz (CxA)';

  opts.source='Manual';opts.by='Dana Ortiz (CxA)';it=newIssue(opts);

 var st=!d?pill('pass','Matches'):res?pill('pass',res==='accepted'?'Accepted':'Issue '+res):pill('warn','Differs');
 var btns='<button class="btn" type="button" data-act="close">Close</button>';
 if(d&&!res)btns+='<button class="btn" type="button" data-act="attr-issue" data-unit="'+unit+'" data-k="'+k+'">Raise issue</button><button class="btn primary" type="button" data-act="attr-accept" data-unit="'+unit+'" data-k="'+k+'">Accept as installed</button>';
 modal('<div class="row spread"><h3><span class="mono">'+unit+'</span> · '+esc(lab)+'</h3>'+st+'</div><div class="sub">Model verification compares three sources.</div>'+
  '<dl class="kv"><dt>Specified</dt><dd>'+(esc(v.spec)||'—')+'</dd><dt>Submitted</dt><dd>'+(esc(v.sub)||'—')+'</dd><dt>Installed</dt><dd>'+(esc(v.inst)||'<span class="muted">not entered yet</span>')+'</dd></dl>'+
  (d&&!res?'<p class="note">Decide whether the difference is acceptable or needs to be fixed.</p>':'')+'<div class="btnrow">'+btns+'</div>');
}
function attestSheet(){
 var u=S.phone.unit;
 modal('<h3>Mark '+u+' complete</h3><div class="sub">You are confirming the statement below for '+esc(CO.HVAC)+'.</div>'+
  '<div class="cm" style="margin-bottom:12px">Installation and start-up of this equipment is complete, required documentation has been provided, and the equipment is ready for functional performance testing.</div>'+
  '<div id="att1"><div class="field"><label for="att-name">Your name</label><input class="inp" id="att-name" value="Sam Rivera"></div><div class="field"><label for="att-mail">Email for the code</label><input class="inp" id="att-mail" value="sam@keystonemech.example"></div><div class="btnrow"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="att-send">Email me a code</button></div></div>'+
  '<div id="att2" hidden><div class="field"><label for="att-code">6-digit code (demo: type any 6 digits)</label><input class="inp mono" id="att-code" inputmode="numeric" maxlength="6" placeholder="000000"></div><div class="btnrow"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="att-submit">Confirm and submit</button></div></div>');
}
function selectAll(sec){
 var s=SECS.filter(function(x){return x.id===sec;})[0],n=0;
 UNITS.forEach(function(u){linesOf(s.trade).filter(function(l){return l.sec===s;}).forEach(function(l){if(!locked(u.tag,s.trade)&&S.res[u.tag][l.id]!=='p'){S.res[u.tag][l.id]='p';touch(u.tag,s.trade);n++;}});});
 log('Dana Ortiz','marked '+s.title+' Passed for all units');
 closeModal();render();toast(n+' lines marked Passed');
}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;
 var a=el.getAttribute('data-act'),d=el.dataset;
 switch(a){
 case 'view':S.view=d.v;closeModal();render();break;
 case 'hint':S.hint=false;render();break;
 case 'tab':S.tab=d.t;render();break;
 case 'trade':S.trade=d.trade;render();break;
 case 'goto-matrix':S.tab='checklists';S.trade=d.trade||'All';render();break;
 case 'rtab':S.reportTab=d.r;render();break;
 case 'ifilter':S.issueFilter=d.f;render();break;
 case 'close':closeModal();break;
 case 'verify':verify(d.unit,d.trade);break;
 case 'return':returnSheet(d.unit,d.trade);break;
 case 'ret-save':
  S.st[d.unit][d.trade]='inprogress';S.returned[d.unit+'|'+d.trade]=document.getElementById('ret-c').value.trim()||'Please recheck.';
  log('Dana Ortiz','returned '+d.unit+' '+TL[d.trade]+' checklist');closeModal();render();toast('Returned to '+CO[d.trade]);break;
 case 'cell':{
  if(isNarrow()){toast('The matrix is view-only on a phone');break;}
  var l=ALL.filter(function(x){return x.id===d.line;})[0],tr=l.sec.trade,cur=S.res[d.unit][d.line];
  var nxt={undefined:'p',p:'n',n:'f',f:''}[cur];
  if(nxt==='f'){issueSheet({kind:'line',unit:d.unit,line:d.line,trade:tr},{desc:d.unit+': '+l.label+' — ',asset:d.unit,trade:tr,pri:'HIGH'});break;}
  if(nxt==='')delete S.res[d.unit][d.line];else{S.res[d.unit][d.line]=nxt;touch(d.unit,tr);}
  render();break;}
 case 'attr':attrModal(d.unit,d.k);break;
 case 'attr-accept':S.resolve[d.unit][d.k]='accepted';log('Dana Ortiz','accepted '+d.unit+' model difference');closeModal();render();toast('Accepted');break;
 case 'attr-issue':{
  var lab=ALL.filter(function(x){return x.attr&&x.attr.k===d.k;})[0].label,v=vals(d.unit,d.k);
  issueSheet({kind:'attr',unit:d.unit,k:d.k},{desc:d.unit+' '+lab.toLowerCase()+' differs. Specified '+v.spec+', submitted '+v.sub+', installed '+(v.inst||'not entered')+'.',asset:d.unit,trade:'HVAC',pri:'HIGH'});break;}
 case 'secall':{
  var s=SECS.filter(function(x){return x.id===d.sec;})[0];
  modal('<h3>Mark all Passed?</h3><div class="sub">Every open line in “'+esc(s.title)+'” becomes Passed for all '+UNITS.length+' units. Use this for identical units where each was checked.</div><div class="btnrow"><button class="btn" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" data-act="secall-go" data-sec="'+d.sec+'">Mark Passed</button></div>');break;}
 case 'secall-go':selectAll(d.sec);break;
 case 'issue':issueDetail(d.id);break;
 case 'issue-new':issueSheet({kind:'free'},{desc:'',asset:'',trade:'HVAC',pri:'MODERATE'});break;
 case 'is-photo':{var on=el.getAttribute('data-on')==='1';el.setAttribute('data-on',on?'0':'1');el.textContent=on?'Add photo':'Photo added ✓';break;}
 case 'is-save':saveIssue();break;
 case 'inext':{
  var it=issueById(d.id);it.status=d.to;
  log(S.view==='agent'?'Dana Ortiz':'Sam Rivera','moved '+it.id+' to '+d.to);
  closeModal();render();toast(it.id+': '+d.to);break;}
 case 'icomment':{
  var inp=document.getElementById('cm-in'),tx=inp.value.trim();if(!tx)break;
  issueById(d.id).comments.push({who:S.view==='agent'?'Dana Ortiz':'Sam Rivera',text:tx,t:nowT()});issueDetail(d.id);break;}
 case 'tres':{
  var at=S.test.attempts.filter(function(x){return x.n===S.test.cur;})[0];
  at.res[d.line]=at.res[d.line]===d.val?undefined:d.val;if(!at.res[d.line])delete at.res[d.line];
  render();break;}
 case 'tissue':{
  var line=TESTLINES.filter(function(x){return x.id===d.line;})[0];
  issueSheet({kind:'test',n:S.test.cur,line:d.line},{desc:'Test TST-11: '+line.x.replace(/\{\{(\w+)\}\}/g,function(m,k){return TESTVARS[k];}),asset:'RTU-1',trade:'HVAC',pri:'HIGH'});break;}
 case 'tatt':S.test.cur=+d.n;render();break;
 case 'retest':{var n=S.test.attempts.length+1;S.test.attempts.push({n:n,res:{},issue:{}});S.test.cur=n;log('Dana Ortiz','started attempt '+n+' of TST-11');render();toast('Attempt '+n+' started. Attempt '+(n-1)+' is kept.');break;}
 /* phone */
 case 'offline':
  S.phone.offline=!S.phone.offline;
  if(!S.phone.offline&&S.phone.queued){toast(S.phone.queued+' saved change'+(S.phone.queued===1?'':'s')+' synced');S.phone.queued=0;}
  render();break;
 case 'popen':S.phone.screen='checklist';S.phone.unit=d.unit;S.phone.collapsed={};render();break;
 case 'pback':S.phone.screen='home';render();break;
 case 'psec':{var s2=SECS.filter(function(x){return x.id===d.sec;})[0];S.phone.collapsed[d.sec]=!collapsed(S.phone.unit,s2);render();break;}
 case 'psecall':{
  var u=S.phone.unit,s3=SECS.filter(function(x){return x.id===d.sec;})[0];
  linesOf('HVAC').filter(function(l){return l.sec===s3;}).forEach(function(l){if(!S.res[u][l.id]){S.res[u][l.id]='p';if(S.phone.offline)S.phone.queued++;}});
  touch(u,'HVAC');render();break;}
 case 'pres':{
  if(d.val==='f'){
   var l2=ALL.filter(function(x){return x.id===d.line;})[0];
   issueSheet({kind:'line',unit:d.unit,line:d.line,trade:'HVAC'},{desc:l2.label+' — ',asset:d.unit,trade:'HVAC',pri:'HIGH'});break;}
  S.res[d.unit][d.line]=S.res[d.unit][d.line]===d.val?undefined:d.val;
  if(!S.res[d.unit][d.line])delete S.res[d.unit][d.line];else{touch(d.unit,'HVAC');if(S.phone.offline)S.phone.queued++;}
  render();break;}
 case 'photo':S.photo[d.key]=!S.photo[d.key];render();break;
 case 'complete':attestSheet();break;
 case 'att-send':document.getElementById('att1').hidden=true;document.getElementById('att2').hidden=false;document.getElementById('att-code').focus();toast('Code sent to '+document.getElementById('att-mail').value);break;
 case 'att-submit':{
  var code=document.getElementById('att-code').value.replace(/\D/g,'');
  if(code.length!==6){toast('Enter the 6-digit code');break;}
  var un=S.phone.unit;S.st[un].HVAC='complete';delete S.returned[un+'|HVAC'];
  log('Sam Rivera','submitted '+un+' HVAC checklist (code verified)');
  closeModal();render();toast('Submitted. The agent can now verify it.');break;}
 }
});
document.addEventListener('keydown',function(e){
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('tr.click')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',function(e){
 var t=e.target;if(!t.dataset||!t.dataset.instUnit)return;
 S.inst[t.dataset.instUnit][t.dataset.instK]=t.value;touch(t.dataset.instUnit,'HVAC');
 var pf=$('.ph-foot');if(pf)pf.innerHTML=phoneFoot();
});
document.addEventListener('change',function(e){
 var t=e.target;if(!t.dataset||!t.dataset.instUnit)return;
 if(S.phone.offline){S.phone.queued++;var ob=$('#offbar');if(ob)ob.textContent='No signal · '+S.phone.queued+' change'+(S.phone.queued===1?'':'s')+' saved on this device';}
});

render();
})();
</script>

</body>
</html>
